<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration | BrightPath Tuition Classes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#1f2937;line-height:1.6}
header{background:#173b7a;color:white;padding:16px 7%;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{font-size:24px;font-weight:700}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:white;text-decoration:none;font-weight:600}
nav a:hover{text-decoration:underline}
.container{width:86%;max-width:1100px;margin:45px auto}
.hero{text-align:center;margin-bottom:35px}
.hero h1{font-size:38px;color:#173b7a;margin-bottom:10px}
.hero p{color:#64748b}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}
.card{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
.card h2,.card h3{color:#173b7a;margin-bottom:10px}
.form-box{max-width:520px;margin:auto;background:white;padding:30px;border-radius:14px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
label{display:block;margin:12px 0 6px;font-weight:600}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
textarea{min-height:120px;resize:vertical}
.btn{display:inline-block;background:#173b7a;color:white;border:0;border-radius:8px;padding:12px 20px;margin-top:18px;text-decoration:none;cursor:pointer;font-weight:700}
.btn:hover{background:#0f2d5d}
.price{font-size:30px;font-weight:700;color:#173b7a;margin:12px 0}
ul{padding-left:20px;margin:12px 0}
footer{background:#102a56;color:white;text-align:center;padding:28px 7%;margin-top:60px}
.social{display:flex;justify-content:center;gap:20px;margin:12px 0}
.social a{color:white;text-decoration:none;font-size:25px}
.small{font-size:14px;color:#64748b}
table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}
th,td{padding:15px;text-align:left;border-bottom:1px solid #e5e7eb}
th{background:#173b7a;color:white}
@media(max-width:650px){header{gap:12px}.hero h1{font-size:30px}nav{gap:10px;font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="logo">BrightPath Tuition Classes</div>
  <nav>
    <a href="registration.html">Registration</a>
    <a href="login.html">Login</a>
    <a href="courses.html">Courses</a>
    <a href="feedback.html">Feedback</a>
    <a href="pricing.html">Price Details</a>
  </nav>
</header>

<main class="container">
<section class="hero"><h1>Student Registration</h1><p>Join BrightPath and start learning with expert guidance.</p></section>
<div class="form-box">
<form>
<label for="name">Full Name</label><input id="name" type="text" placeholder="Enter your full name" required>
<label for="email">Email</label><input id="email" type="email" placeholder="Enter your email" required>
<label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="Enter your phone number" required>
<label for="course">Select Course</label>
<select id="course"><option>Class 9-10 Foundation</option><option>Class 11-12 Science</option><option>JEE Preparation</option><option>NEET Preparation</option></select>
<label for="password">Create Password</label><input id="password" type="password" placeholder="Create a password" required>
<button class="btn" type="submit">Register Now</button>
</form>
<p class="small" style="margin-top:15px">Already registered? <a href="login.html">Login here</a>.</p>
</div>
</main>

<footer>
  <div class="social">
    <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
    <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
  </div>
  <p>© 2026 BrightPath Tuition Classes. All rights reserved.</p>
  <p class="small" style="color:#dbeafe">Learn today. Grow tomorrow.</p>
</footer>

</body>
</html>
